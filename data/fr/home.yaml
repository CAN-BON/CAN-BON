  introduction_title : "Réseau d'observation de la biodiversité du Canada"
  introduction_text : "Un système national coordonné de surveillance de la biodiversité sur l'ensemble des terres, des eaux et des côtes du Canada."


canada_bon_columns : 
  left :
    title : "La biodiversité du Canada évolue rapidement"
    text: |
        Parallèlement, la demande de données sur la nature utiles à la prise de décisions est en augmentation. 

        À l'heure actuelle, les informations sont dispersées entre universités, gouvernements, ONG, communautés autochtones et organisations privées, ce qui rend difficile la compréhension de l'état de la nature au Canada. 

        Un **Réseau canadien d'observation de la biodiversité (CAN BON)** jouerait un rôle clé dans la coordination des efforts de suivi de la biodiversité et fournirait aux décideurs des informations crédibles, pertinentes et actualisées.
  right : 
    title: "Un BON canadien pourrait"
    text: |
      - **Créer** un système national coordonné de surveillance de la biodiversité en connectant les systèmes d'observation, l'infrastructure de données et les connaissances autochtones.
      - **Appuyer** la modélisation et la prévision des tendances de la biodiversité.
      - **Améliorer** les normes de suivi de la biodiversité et l'accessibilité des données.
      - **Générer** des informations utiles à la prise de décision pour les politiques et les investissements en matière de conservation.
      - **Renforcer** les capacités pour répondre aux priorités nationales (30x30, protection des espèces menacées, sécurité de l'eau et comptabilité du capital naturel) et aux engagements internationaux.

two_columns:
  top_text:
    Le Canada a alloué 3,8 milliards de dollars à l'initiative [**Une force de la nature**](https://www.canada.ca/fr/services/environnement/nature/strategie-nature.html), faisant ainsi progresser son objectif de protéger et de conserver 30 % des terres et des eaux d'ici 2030 (cible 30x30).
    En tant que partie au [**Cadre mondial de Kunming-Montréal pour la biodiversité (CMKM)**](https://www.cbd.int/gbf/targets), le Canada s'est également engagé à restaurer les écosystèmes dégradés, à mettre fin aux extinctions d'espèces causées par l'activité humaine, ainsi qu'à limiter la prolifération des espèces envahissantes et la perte de biodiversité.
  headline: "Atteindre ces objectifs nécessite des données fiables pour comprendre la biodiversité, suivre les changements et mesurer les progrès."
  bottom_text : "CAN BON relie et coordonne les initiatives de suivi de la biodiversité à l'échelle du Canada, contribuant ainsi à la réalisation des engagements nationaux et internationaux en matière de nature."
  

