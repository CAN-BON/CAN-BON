  introduction_title : "Canada Biodiversity Observation Network"
  introduction_text : "A coordinated national system to monitor biodiversity across Canada's lands, waters, and coasts."

canada_bon_columns : 
  left :
    title : "Canada's biodiversity is changing rapidly"
    text: |
        At the same time, demand for decision-useful nature data is increasing.

        Currently, information is fragmented across universities, governments, NGOs, Indigenous communities, and private organisations, making it difficult to understand the state of Canada's nature.

        A **Canada Biodiversity Observation Network (CAN BON)** would provide a key role in coordinating biodiversity monitoring efforts and providing decision-makers with credible, timely, and relevant information.
  right : 
    title: "A Canada BON would"
    text: |
      - **Build** a coordinated national system for biodiversity monitoring by connecting observation systems, data infrastructure, and Indigenous knowledge
      - **Support** modelling and forecasting of biodiversity trends
      - **Improve** biodiversity monitoring standards and data accessibility
      - **Generate** decision-useful information for conservation policy and investment
      - **Enhance** capacity to meet national priorities (30x30, species-at-risk protection, water security, and natural capital accounting) and international commitments

two_columns:
  top_text:
    Canada has committed $3.8 billion to [**A Force of Nature**](https://www.canada.ca/en/services/environment/nature/nature-strategy.html), advancing its goal to protect and conserve 30% of lands and waters by 2030 (30x30). 
    As a Party to the [**Kunming-Montreal Global Biodiversity Framework (KMGBF)**](https://www.cbd.int/gbf/targets), Canada has also committed to restoring degraded ecosystems, halting human-caused species extinctions, and reducing invasive species and biodiversity loss.
  headline: "Delivering on these goals requires reliable data to understand biodiversity, track change, and measure progress."
  bottom_text : "CAN BON connects and coordinates biodiversity monitoring efforts across Canada, helping to deliver on national and international nature commitments."
  box_title: "The 30x30 initiative"
  box_text: "Protecting **30%** of Canadian lands and waters by **2030**"
  force_of_nature_text: "Canada's \"A Force of Nature\""
