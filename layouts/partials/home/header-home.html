{{ $lang := .Site.Language.Lang }}
<!-- used to be .Site.Language.Name -->
{{ $d := index hugo.Data $lang "home" "header" }}

<div class="navbar-home">
    <div class="navbar-items left">
        <a class="navbar-items left" href="{{ $d.home_link | absLangURL }}">
            <img class="navbar-logo no-drag" src="{{ "images/logo-red.png" | relURL }}">
            <p class="navbar-title" >{{ $d.canbon }}</p>
        </a>
    </div>
    <div class="hero-right">
        <div class="navbar-items right"> 
            <a href="{{ $d.home_link | absLangURL }}" class="navbar-link active">{{ $d.home }}</a>
            <a href="{{ $d.about_link | absLangURL }}" class="navbar-link {{ if hasPrefix .Permalink ($d.about_link | absLangURL) }}active{{ end }}">{{ $d.about }}</a>
            <a href="{{ $d.resources_link | absLangURL }}" class="navbar-link {{ if hasPrefix .Permalink ($d.resources_link | absLangURL) }}active{{ end }}">{{ $d.resources }}</a>
            <a href="{{ $d.summit_link | absLangURL }}" class="navbar-link {{ if hasPrefix .Permalink ($d.summit_link | absLangURL) }}active{{ end }}">{{ $d.summit }}</a>
            {{ range .Translations }}
                <a class="lang-link" href="{{ .Permalink }}">{{ .Language.Name }}</a>
            {{ end }}
        </div>
    </div>
</div>
